[project]
name = "iceberg-detect"
version = "0.1.0"
description = "Detection engine and versioned rule packs (regex + entropy + keyword proximity)."
requires-python = ">=3.14"
dependencies = [
    "iceberg-core",
    # Rule packs are YAML shipped inside the engine image (ADR 0008).
    "pyyaml>=6.0.3",
    # Imported directly by the engine module — declared rather than leaned on
    # transitively through iceberg-core, same as everywhere else here.
    "structlog>=26.1.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
iceberg-core = { workspace = true }
