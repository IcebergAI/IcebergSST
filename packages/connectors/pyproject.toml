[project]
name = "iceberg-connectors"
version = "0.1.0"
description = "Connector interface and source connectors (Confluence MVP; Jira/SMB later)."
requires-python = ">=3.13"
dependencies = [
    "iceberg-core",
    "structlog>=25.5.0",
    # PDF text layer. No OCR — a scanned page yields nothing, by design (#46).
    "pypdf>=6.4.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
iceberg-core = { workspace = true }
