[project]
name = "iceberg-connectors"
version = "0.1.0"
description = "Connector SDK and source connectors: Confluence, Jira, SMB/NFS file shares."
requires-python = ">=3.14"
dependencies = [
    "iceberg-core",
    "structlog>=26.1.0",
    # PDF text layer. No OCR — a scanned page yields nothing, by design (#46).
    "pypdf>=6.15.0",
    # Connectors talk to source APIs over HTTP (#47).
    "httpx2>=2.7.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
iceberg-core = { workspace = true }
