[project]
name = "iceberg-core"
version = "0.1.0"
description = "Shared models, config, secret-store, fingerprinting, and redaction utilities."
requires-python = ">=3.13"
dependencies = [
    "prometheus-client>=0.25.0",
    "structlog>=26.1.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
