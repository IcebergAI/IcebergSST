[project]
name = "iceberg-core"
version = "0.1.0"
description = "Shared models, config, secret-store, fingerprinting, and redaction utilities."
requires-python = ">=3.13"
dependencies = [
    "cryptography>=49.0.0",
    "prometheus-client>=0.25.0",
    "pydantic-settings>=2.14.2",
    "structlog>=26.1.0",
]

# Database access is an *extra*, not a base dependency. Only the api role installs it
# (`iceberg-core[db]`), so the engine image never even ships asyncpg/sqlmodel — the
# ADR 0002 boundary is enforced by packaging, not just by convention. See #52.
[project.optional-dependencies]
db = [
    "asyncpg>=0.31.0",
    "sqlmodel>=0.0.39",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
