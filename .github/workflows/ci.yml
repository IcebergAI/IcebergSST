name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing in this workflow writes back to the repository; least privilege keeps
# a compromised build step (or a dependency it pulls in) from being able to.
permissions:
  contents: read

jobs:
  checks:
    name: lint + type + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is the target runtime; 3.13 is the supported floor
        # (docs/spikes/python-3.14-compat.md).
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync workspace (locked)
        run: uv sync --locked

      - name: Lint
        run: make lint

      - name: Type-check
        run: make type

      - name: Test
        run: make test

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so previously committed-then-removed secrets are caught.
          fetch-depth: 0

      # --config is explicit rather than left to gitleaks' lookup: the allowlist in
      # .gitleaks.toml is what keeps this job green, and "which config did it use?"
      # should be answerable from the workflow.
      - name: Run gitleaks over full git history
        run: |
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0='*' \
            ghcr.io/gitleaks/gitleaks:v8.30.0 \
            git /repo --redact --verbose --config /repo/.gitleaks.toml
