[project]
name = "icebergsst"
version = "0.1.0"
description = "IcebergSST — secret scanning for non-git enterprise sources (workspace root)"
requires-python = ">=3.13"
dependencies = [
    "iceberg-api",
    "iceberg-engine",
]

[tool.uv]
# The root is a virtual aggregator, not an installable package.
package = false

[tool.uv.workspace]
members = ["apps/*", "packages/*"]

[tool.uv.sources]
iceberg-api = { workspace = true }
iceberg-engine = { workspace = true }
iceberg-core = { workspace = true }
iceberg-detect = { workspace = true }
iceberg-connectors = { workspace = true }

[dependency-groups]
dev = [
    "httpx2>=2.7.0",
    # croniter ships no inline types.
    "types-croniter>=6.0.0",
    # Reads deploy/compose/docker-compose.yml in the deployment invariant tests.
    "pyyaml>=6.0.3",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "S",   # flake8-bandit — this is a security tool; keep the linter's eyes open
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Asserts are the point of tests, and a secret scanner's test suite is full of
# deliberately fake secret-shaped fixtures — S105/S106 flag every one of them.
# Real leaks are caught by the gitleaks job over the whole repo, not by this rule.
"**/tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["apps", "packages"]
warn_unreachable = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["apps", "packages", "tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]
