[project]
name = "icebergsst"
version = "0.1.0"
description = "IcebergSST — secret scanning for non-git enterprise sources (workspace root)"
requires-python = ">=3.13"
dependencies = [
    "iceberg-api",
    "iceberg-engine",
]

[tool.uv]
# The root is a virtual aggregator, not an installable package.
package = false

[tool.uv.workspace]
members = ["apps/*", "packages/*"]

[tool.uv.sources]
iceberg-api = { workspace = true }
iceberg-engine = { workspace = true }
iceberg-core = { workspace = true }
iceberg-detect = { workspace = true }
iceberg-connectors = { workspace = true }

[dependency-groups]
dev = [
    "httpx2>=2.7.0",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.22",
    "testcontainers[postgres]>=4.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "S",   # flake8-bandit — this is a security tool; keep the linter's eyes open
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"] # asserts are the point of tests
"conftest.py" = ["S101"] # shared fixtures assert their own invariants
# Autogenerated by alembic: the template always imports sa/sqlmodel whether the
# revision ends up using them or not. Not worth hand-editing every migration.
"migrations/versions/*" = ["F401"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["apps", "packages"]
warn_unreachable = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["apps", "packages"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]
asyncio_mode = "auto"
# Must be set explicitly: leaving it unset emits a DeprecationWarning, and
# filterwarnings = ["error"] turns that into a hard suite failure.
asyncio_default_fixture_loop_scope = "session"
# Tests must share the fixtures' loop: a function-scoped loop would close while
# the session-scoped engine's asyncpg connections are still bound to it, and the
# resulting ResourceWarning is fatal under filterwarnings = ["error"].
asyncio_default_test_loop_scope = "session"
markers = [
    "postgres: needs the session-scoped Postgres container (requires Docker)",
]
