{{/*
Two Secrets, and the split is the point (ADR 0002).

The api's holds the database URL, the master key, the session secret and the
OIDC client secret. The engine's holds a broker URL and its own token — no
database credential and no master key, because there is nothing an engine could
correctly do with either.

Both are skipped when `secrets.existingApiSecret` / `existingEngineSecret` name
Secrets you created out of band, which is what production should do: values
passed to Helm end up in the release's stored manifest, and a master key does
not belong there.
*/}}
{{- if not .Values.secrets.existingApiSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-api" (include "icebergsst.fullname" .) }}
  labels:
    {{- include "icebergsst.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
type: Opaque
stringData:
  ICEBERG_DATABASE_URL: {{ required "secrets.api.databaseUrl is required unless secrets.existingApiSecret is set" .Values.secrets.api.databaseUrl | quote }}
  ICEBERG_REDIS_URL: {{ required "secrets.api.redisUrl is required unless secrets.existingApiSecret is set" .Values.secrets.api.redisUrl | quote }}
  # Losing this makes every stored credential ref undecryptable. Back it up
  # somewhere that survives the cluster (docs/security.md § Key rotation).
  ICEBERG_MASTER_KEY: {{ required "secrets.api.masterKey is required unless secrets.existingApiSecret is set" .Values.secrets.api.masterKey | quote }}
  ICEBERG_FINGERPRINT_PEPPER_REF: {{ required "secrets.api.fingerprintPepperRef is required unless secrets.existingApiSecret is set" .Values.secrets.api.fingerprintPepperRef | quote }}
  ICEBERG_SESSION_SECRET: {{ required "secrets.api.sessionSecret is required unless secrets.existingApiSecret is set" .Values.secrets.api.sessionSecret | quote }}
  ICEBERG_OIDC_CLIENT_SECRET: {{ .Values.secrets.api.oidcClientSecret | quote }}
  ICEBERG_SMTP_PASSWORD: {{ .Values.secrets.api.smtpPassword | quote }}
{{- end }}
{{- if not .Values.secrets.existingEngineSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-engine" (include "icebergsst.fullname" .) }}
  labels:
    {{- include "icebergsst.labels" . | nindent 4 }}
    app.kubernetes.io/component: engine
type: Opaque
stringData:
  # Everything an engine is allowed to hold. Adding a database URL here would be
  # caught by tests/test_deploy_invariants.py, which reads this template.
  ICEBERG_REDIS_URL: {{ required "secrets.engine.redisUrl is required unless secrets.existingEngineSecret is set" .Values.secrets.engine.redisUrl | quote }}
  ICEBERG_ENGINE_ID: {{ .Values.secrets.engine.engineId | quote }}
  ICEBERG_ENGINE_TOKEN: {{ .Values.secrets.engine.engineToken | quote }}
{{- end }}
