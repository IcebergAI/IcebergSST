{{/*
Only the api gets a Service. Engines are consumers, not servers: nothing calls
them, so nothing needs to find them.
*/}}
{{- $role := "api" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "icebergsst.componentName" (dict "context" . "role" $role) }}
  labels:
    {{- include "icebergsst.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $role }}
  {{- with .Values.api.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "icebergsst.selectorLabels" (dict "context" . "role" $role) | nindent 4 }}
