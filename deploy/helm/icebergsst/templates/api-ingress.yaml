{{- if .Values.api.ingress.enabled }}
{{- $role := "api" }}
{{- $fullName := include "icebergsst.componentName" (dict "context" . "role" $role) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "icebergsst.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $role }}
  {{- with .Values.api.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.api.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.api.ingress.tls.enabled }}
  # The session cookie is Secure by default and the console runs under HSTS in
  # production, so a deployment reachable over plain HTTP would break login in a
  # way that looks like a bug in the identity provider.
  tls:
    - hosts:
        - {{ .Values.api.ingress.host | quote }}
      secretName: {{ .Values.api.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.api.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.api.ingress.path }}
            pathType: {{ .Values.api.ingress.pathType }}
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ .Values.api.service.port }}
{{- end }}
