{{/*
One ServiceAccount per role, so "engines may not read the api's Secret" is
expressible as a Kubernetes RBAC rule rather than only as a property of the
templates. Neither account needs API-server access, so neither gets a token
mounted.
*/}}
{{- if .Values.serviceAccount.create }}
{{- range $role := list "api" "engine" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "icebergsst.componentName" (dict "context" $ "role" $role) }}
  labels:
    {{- include "icebergsst.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $role }}
  {{- with $.Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Nothing here talks to the Kubernetes API. A mounted token is a credential the
# workload cannot use and an attacker can.
automountServiceAccountToken: false
---
{{- end }}
{{- end }}
