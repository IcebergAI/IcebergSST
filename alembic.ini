# Alembic configuration (issue #27).
#
# Owned by the api role — it holds the schema and is the only component with
# database credentials (ADR 0002, docs/deployment.md). Engines never migrate.
#
# The database URL is deliberately NOT set here: migrations/env.py reads it from
# ApiSettings so there is exactly one place a DSN comes from, and no credential
# is ever committed to the repo.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
