# Alembic configuration for the api role — the only role that owns the schema
# (docs/deployment.md § Migrations). Run from the repo root:
#
#   uv run alembic -c apps/api/alembic.ini upgrade head
#
# The database URL is not set here: env.py takes it from ICEBERG_DATABASE_URL via
# ApiSettings, so migrations and the running API can never disagree about which
# database they mean (and a URL with a password stays out of version control).

[alembic]
script_location = %(here)s/src/iceberg_api/migrations
prepend_sys_path = .
path_separator = os
timezone = UTC

# Revision filenames sort chronologically and read as prose in a directory
# listing: 0001_initial_schema.py rather than a bare hash.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
