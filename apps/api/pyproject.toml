[project]
name = "iceberg-api"
version = "0.1.0"
description = "FastAPI control plane: REST API, HTMX UI, scheduler, notifications. Sole writer of record."
requires-python = ">=3.14"
dependencies = [
    # Only the api role owns the schema and runs migrations (docs/deployment.md).
    "alembic>=1.18.5",
    # Cron expression parsing for the schedule model and scheduler tick.
    "croniter>=6.0.0",
    # iceberg_api.dispatch enqueues task ids on the broker (ADR 0009). Declared
    # here because the api image installs this package alone: leaning on the
    # workspace having iceberg-engine installed builds an image that imports
    # dramatiq and does not have it.
    "dramatiq[redis]>=2.2.0",
    "fastapi>=0.139.2",
    # [db] pulls in the ORM: the api role is the only one that owns the schema,
    # so it is the only one that declares a dependency on it (ADR 0002).
    "iceberg-core[db]",
    # The M3 web UI's template engine. Imported directly by iceberg_api.web —
    # declared rather than leaned on transitively through fastapi's extras.
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.2.12",
    # Starlette needs it to parse form bodies: the CSRF token arrives that way
    # from HTMX posts, and the M3 UI is all forms.
    "python-multipart>=0.0.20",
    # OIDC: token exchange and JWKS fetches (httpx2), ID-token verification (pyjwt).
    "httpx2>=2.7.0",
    "pyjwt[crypto]>=2.13.0",
    # The packaged remediation-guidance catalog (#142) is YAML, like the rule
    # packs it parallels — reviewed as text, loaded and validated at startup.
    "pyyaml>=6.0.3",
    # Imported directly by app.py — declared rather than leaned on transitively
    # through iceberg-core.
    "prometheus-client>=0.25.0",
    "structlog>=26.1.0",
    # ASGI server for the container entrypoint.
    "uvicorn[standard]>=0.34.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
iceberg-core = { workspace = true }
