[project]
name = "iceberg-api"
version = "0.1.0"
description = "FastAPI control plane: REST API, HTMX UI, scheduler, notifications. Sole writer of record."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.139.2",
    "iceberg-core",
    # Imported directly by app.py — declared rather than leaned on transitively
    # through iceberg-core.
    "prometheus-client>=0.25.0",
    "structlog>=26.1.0",
    # ASGI server for the container entrypoint; FastAPI ships no server itself.
    "uvicorn>=0.44.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
iceberg-core = { workspace = true }
